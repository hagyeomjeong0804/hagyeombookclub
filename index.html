<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>루미북클럽 (Lumi Book Club)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { primary: '#4F46E5' } } }
    }
  </script>
  
  <!-- PWA 필수 설정 -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#4F46E5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="루미북클럽" />

  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    body { font-family: 'Pretendard', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#F9F8F6] text-gray-800 select-none pb-24">

  <div id="app"></div>

  <script>
    // 초기 로컬 스토리지 데이터
    let books = JSON.parse(localStorage.getItem('lumi_books')) || [
      { id: 1, title: '모든 삶은 작고 크다', author: '클라라 피츠', cover: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400&auto=format&fit=crop&q=80', progress: 65, category: '소설' },
      { id: 2, title: '클린 코드', author: '로버트 C. 마틴', cover: 'https://images.unsplash.com/photo-1532012197267-da84d127e765?w=400&auto=format&fit=crop&q=80', progress: 100, category: '개발' },
      { id: 3, title: '돈의 심리학', author: '모건 하우절', cover: 'https://images.unsplash.com/photo-1554415707-6e8cfc93fe23?w=400&auto=format&fit=crop&q=80', progress: 30, category: '경제' }
    ];

    let currentFilter = 'all';
    let deferredPrompt = null; // PWA 설치 프롬프트 저장용 변수

    // 브라우저의 PWA 설치 이벤트 가로채기
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const installBtn = document.getElementById('pwa-install-btn');
      if (installBtn) installBtn.classList.remove('hidden'); // 설치 버튼 표시
    });

    // PWA 앱 설치 실행 함수
    function installPWA() {
      if (!deferredPrompt) {
        alert('이미 앱이 설치되었거나, 브라우저 메뉴에서 "홈 화면에 추가"를 진행해 주세요.');
        return;
      }
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then((choiceResult) => {
        if (choiceResult.outcome === 'accepted') {
          console.log('사용자가 PWA 설치를 수락했습니다.');
        }
        deferredPrompt = null;
        const installBtn = document.getElementById('pwa-install-btn');
        if (installBtn) installBtn.classList.add('hidden');
      });
    }

    function saveBooks() {
      localStorage.setItem('lumi_books', JSON.stringify(books));
      render();
    }

    function getAutomaticStats() {
      const now = new Date();
      const month = now.getMonth() + 1;
      const completedCount = books.filter(b => b.progress === 100).length;
      return { month, completedCount };
    }

    function toggleAddModal(open) {
      const modal = document.getElementById('add-modal');
      if (open) modal.classList.remove('hidden');
      else modal.classList.add('hidden');
    }

    function handleAddBook(event) {
      event.preventDefault();
      const title = document.getElementById('book-title').value;
      const author = document.getElementById('book-author').value;
      const category = document.getElementById('book-category').value;
      const progress = Number(document.getElementById('book-progress').value);
      const cover = document.getElementById('book-cover').value || 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400&auto=format&fit=crop&q=80';

      const newBook = { id: Date.now(), title, author: author || '미상', cover, progress, category };
      books.unshift(newBook);
      saveBooks();
      toggleAddModal(false);
      event.target.reset();
    }

    function deleteBook(id) {
      if (confirm('이 책을 서재에서 삭제하시겠습니까?')) {
        books = books.filter(b => b.id !== id);
        saveBooks();
      }
    }

    function updateProgress(id, newProgress) {
      books = books.map(b => b.id === id ? { ...b, progress: Number(newProgress) } : b);
      saveBooks();
    }

    function render() {
      const stats = getAutomaticStats();
      const filteredBooks = books.filter(b => {
        if (currentFilter === 'reading') return b.progress > 0 && b.progress < 100;
        if (currentFilter === 'completed') return b.progress === 100;
        return true;
      });

      const html = `
        <!-- 상단 헤더 -->
        <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-gray-200 px-4 py-3 flex items-center justify-between">
          <span class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-500 bg-clip-text text-transparent">📚 루미북클럽</span>
          <div class="flex items-center space-x-2">
            <!-- PWA 앱 설치 버튼 (조건부 표시) -->
            <button id="pwa-install-btn" onclick="installPWA()" class="hidden bg-emerald-600 text-white px-3 py-1.5 rounded-full text-xs font-semibold shadow hover:bg-emerald-700 transition animate-pulse">
              📲 앱 설치
            </button>
            <button onclick="toggleAddModal(true)" class="bg-indigo-600 text-white px-3 py-1.5 rounded-full text-xs font-semibold shadow hover:bg-indigo-700 transition">
              + 책 추가
            </button>
          </div>
        </header>

        <!-- 메인 콘텐츠 -->
        <main class="max-w-md mx-auto p-4">
          <!-- 자동 시간 연동 스트릭/목표 배너 -->
          <div class="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl p-4 text-white shadow-lg mb-4 flex items-center justify-between">
            <div>
              <p class="text-xs text-indigo-100">🔥 자동 스트릭 연동 중</p>
              <h2 class="text-lg font-bold mt-0.5">${stats.month}월 독서 목표 (${stats.completedCount}권 완독)</h2>
              <p class="text-xs text-indigo-200 mt-1">실시간 시스템 날짜 기준 집계</p>
            </div>
            <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center text-sm font-bold">
              ${Math.round((stats.completedCount / 3) * 100)}%
            </div>
          </div>

          <!-- 필터 컨트롤 -->
          <div class="flex space-x-1 bg-gray-200/70 p-1 rounded-xl mb-4 text-xs font-medium">
            <button onclick="currentFilter='all'; render();" class="flex-1 py-1.5 rounded-lg ${currentFilter==='all'?'bg-white shadow text-indigo-600':'text-gray-500'}">전체 (${books.length})</button>
            <button onclick="currentFilter='reading'; render();" class="flex-1 py-1.5 rounded-lg ${currentFilter==='reading'?'bg-white shadow text-indigo-600':'text-gray-500'}">읽는 중</button>
            <button onclick="currentFilter='completed'; render();" class="flex-1 py-1.5 rounded-lg ${currentFilter==='completed'?'bg-white shadow text-indigo-600':'text-gray-500'}">완독</button>
          </div>

          <!-- 책장 뷰 -->
          <div class="bg-amber-900/20 p-4 rounded-2xl border border-amber-900/10 shadow-inner">
            <div class="text-xs font-semibold text-amber-800 mb-3 flex items-center justify-between">
              <span>🪵 수동 관리 원목 선반</span>
              <span>${filteredBooks.length}권 표시 중</span>
            </div>
            
            <div class="grid grid-cols-3 gap-3">
              ${filteredBooks.length === 0 ? '<p class="col-span-3 text-center text-xs text-gray-400 py-6">등록된 책이 없습니다. 책을 추가해보세요!</p>' : ''}
              ${filteredBooks.map(book => `
                <div class="flex flex-col items-center bg-white p-2 rounded-xl shadow-sm border border-gray-100 relative group">
                  <button onclick="deleteBook(${book.id})" class="absolute top-1 right-1 bg-red-500 text-white rounded-full w-5 h-5 text-[10px] flex items-center justify-center opacity-0 group-hover:opacity-100 transition">✕</button>
                  <div class="w-full aspect-[1/1.3] rounded-lg overflow-hidden shadow bg-gray-200 relative mb-2">
                    <img src="${book.cover}" class="w-full h-full object-cover" />
                    <div class="absolute bottom-0 inset-x-0 bg-black/60 text-white text-[10px] py-0.5 text-center font-medium">
                      ${book.progress}%
                    </div>
                  </div>
                  <p class="text-xs font-bold truncate w-full text-center">${book.title}</p>
                  <p class="text-[10px] text-gray-400 truncate w-full text-center">${book.author}</p>
                  
                  <input type="range" min="0" max="100" value="${book.progress}" onchange="updateProgress(${book.id}, this.value)" class="w-full mt-2 accent-indigo-600 h-1" />
                </div>
              `).join('')}
            </div>
            <div class="mt-4 h-3 bg-gradient-to-r from-amber-800 via-amber-700 to-amber-900 rounded-sm shadow-md"></div>
          </div>
        </main>

        <!-- 하단 네비게이션 -->
        <nav class="fixed bottom-0 inset-x-0 bg-white/90 backdrop-blur-md border-t border-gray-200 py-2 px-6 flex justify-around items-center z-30">
          <button class="flex flex-col items-center text-xs text-indigo-600 font-bold"><span class="text-lg">📚</span><span>책장</span></button>
          <button class="flex flex-col items-center text-xs text-gray-400"><span class="text-lg">📊</span><span>통계</span></button>
          <button class="flex flex-col items-center text-xs text-gray-400"><span class="text-lg">🔍</span><span>탐색</span></button>
          <button class="flex flex-col items-center text-xs text-gray-400"><span class="text-lg">👤</span><span>마이</span></button>
        </nav>

        <!-- 책 추가 모달 -->
        <div id="add-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
          <div class="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl">
            <h3 class="text-base font-bold mb-4">📖 새로운 책 수동 등록</h3>
            <form onsubmit="handleAddBook(event)" class="space-y-3">
              <div>
                <label class="text-xs text-gray-500 font-medium">책 제목 *</label>
                <input type="text" id="book-title" required placeholder="예: 어린 왕자" class="w-full mt-1 px-3 py-2 text-sm bg-gray-50 border rounded-xl" />
              </div>
              <div>
                <label class="text-xs text-gray-500 font-medium">저자</label>
                <input type="text" id="book-author" placeholder="예: 생텍쥐페리" class="w-full mt-1 px-3 py-2 text-sm bg-gray-50 border rounded-xl" />
              </div>
              <div>
                <label class="text-xs text-gray-500 font-medium">표지 이미지 URL (선택)</label>
                <input type="url" id="book-cover" placeholder="https://..." class="w-full mt-1 px-3 py-2 text-sm bg-gray-50 border rounded-xl" />
              </div>
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="text-xs text-gray-500 font-medium">카테고리</label>
                  <select id="book-category" class="w-full mt-1 px-3 py-2 text-sm bg-gray-50 border rounded-xl">
                    <option value="소설">소설</option><option value="개발">개발</option><option value="경제">경제</option><option value="인문">인문</option>
                  </select>
                </div>
                <div>
                  <label class="text-xs text-gray-500 font-medium">초기 진행률 (%)</label>
                  <input type="number" id="book-progress" min="0" max="100" value="0" class="w-full mt-1 px-3 py-2 text-sm bg-gray-50 border rounded-xl" />
                </div>
              </div>
              <div class="flex gap-2 pt-3">
                <button type="button" onclick="toggleAddModal(false)" class="flex-1 bg-gray-100 text-gray-600 py-2.5 rounded-xl text-xs font-semibold">취소</button>
                <button type="submit" class="flex-1 bg-indigo-600 text-white py-2.5 rounded-xl text-xs font-semibold">등록하기</button>
              </div>
            </form>
          </div>
        </div>
      `;
      document.getElementById('app').innerHTML = html;
    }

    render();

    // Service Worker 등록
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
