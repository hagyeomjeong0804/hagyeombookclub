<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>루미북클럽 (Lumi Book Club)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: { colors: { primary: '#4F46E5' } }
      }
    }
  </script>
  
  <!-- PWA 필수 설정 -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#4F46E5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="루미북클럽" />

  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    body { font-family: 'Pretendard', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#F9F8F6] text-gray-800 select-none pb-24">

  <!-- 상단 헤더 -->
  <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-gray-200 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <span class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-500 bg-clip-text text-transparent">📚 루미북클럽</span>
    </div>
    <div class="flex items-center space-x-3">
      <button onclick="alert('책 추가 기능은 앱 내 모달에서 지원됩니다!')" class="bg-indigo-600 text-white px-3 py-1.5 rounded-full text-xs font-semibold shadow hover:bg-indigo-700 transition">
        + 책 추가
      </button>
    </div>
  </header>

  <!-- 메인 콘텐츠 영역 -->
  <main class="max-w-md mx-auto p-4">
    <!-- 스트릭 배너 -->
    <div class="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl p-4 text-white shadow-lg mb-4 flex items-center justify-between">
      <div>
        <p class="text-xs text-indigo-100">🔥 연속 독서 14일째</p>
        <h2 class="text-lg font-bold mt-0.5">이번 달 3권 완독 목표</h2>
        <p class="text-xs text-indigo-200 mt-1">목표 달성까지 앞으로 1권 남았어요!</p>
      </div>
      <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center text-xl font-bold">
        75%
      </div>
    </div>

    <!-- 검색 및 뷰 전환 바 -->
    <div class="flex items-center justify-between mb-3 gap-2">
      <input 
        type="text" 
        placeholder="책 제목 또는 저자 검색..." 
        class="w-full px-3 py-2 text-sm bg-white border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500"
      />
      <div class="flex bg-gray-200 p-1 rounded-xl shrink-0">
        <button class="px-2.5 py-1 text-xs rounded-lg font-medium bg-white shadow text-indigo-600">선반</button>
        <button class="px-2.5 py-1 text-xs rounded-lg font-medium text-gray-500">그리드</button>
      </div>
    </div>

    <!-- 세그먼트 탭 -->
    <div class="flex space-x-1 bg-gray-200/70 p-1 rounded-xl mb-4 text-xs font-medium">
      <button class="flex-1 py-1.5 rounded-lg bg-white shadow text-indigo-600">전체 (5)</button>
      <button class="flex-1 py-1.5 rounded-lg text-gray-500">읽는 중</button>
      <button class="flex-1 py-1.5 rounded-lg text-gray-500">완독</button>
      <button class="flex-1 py-1.5 rounded-lg text-gray-500">위시</button>
    </div>

    <!-- 3D 원목 선반 뷰 -->
    <div class="space-y-6">
      <div class="bg-amber-900/20 p-4 rounded-2xl border border-amber-900/10 shadow-inner">
        <div class="text-xs font-semibold text-amber-800 mb-3 flex items-center justify-between">
          <span>🪵 원목 선반 1층</span>
          <span>5권</span>
        </div>
        <div class="grid grid-cols-3 gap-3">
          
          <!-- 책 아이템 1 -->
          <div class="cursor-pointer group flex flex-col items-center">
            <div class="w-full aspect-[1/1.4] rounded-lg overflow-hidden shadow-md bg-gray-300 relative">
              <img src="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400&auto=format&fit=crop&q=80" class="w-full h-full object-cover" />
              <div class="absolute bottom-0 inset-x-0 bg-black/60 text-white text-[10px] py-0.5 px-1 text-center font-medium">
                65%
              </div>
            </div>
            <p class="text-xs font-semibold mt-1.5 text-center truncate w-full">모든 삶은 작고 크다</p>
            <p class="text-[10px] text-gray-400 truncate w-full text-center">클라라 피츠</p>
          </div>

          <!-- 책 아이템 2 -->
          <div class="cursor-pointer group flex flex-col items-center">
            <div class="w-full aspect-[1/1.4] rounded-lg overflow-hidden shadow-md bg-gray-300 relative">
              <img src="https://images.unsplash.com/photo-1532012197267-da84d127e765?w=400&auto=format&fit=crop&q=80" class="w-full h-full object-cover" />
              <div class="absolute bottom-0 inset-x-0 bg-black/60 text-white text-[10px] py-0.5 px-1 text-center font-medium">
                100%
              </div>
            </div>
            <p class="text-xs font-semibold mt-1.5 text-center truncate w-full">클린 코드</p>
            <p class="text-[10px] text-gray-400 truncate w-full text-center">로버트 C. 마틴</p>
          </div>

          <!-- 책 아이템 3 -->
          <div class="cursor-pointer group flex flex-col items-center">
            <div class="w-full aspect-[1/1.4] rounded-lg overflow-hidden shadow-md bg-gray-300 relative">
              <img src="https://images.unsplash.com/photo-1554415707-6e8cfc93fe23?w=400&auto=format&fit=crop&q=80" class="w-full h-full object-cover" />
              <div class="absolute bottom-0 inset-x-0 bg-black/60 text-white text-[10px] py-0.5 px-1 text-center font-medium">
                30%
              </div>
            </div>
            <p class="text-xs font-semibold mt-1.5 text-center truncate w-full">돈의 심리학</p>
            <p class="text-[10px] text-gray-400 truncate w-full text-center">모건 하우절</p>
          </div>

        </div>
        <!-- 선반 판재 효과 -->
        <div class="mt-4 h-3 bg-gradient-to-r from-amber-800 via-amber-700 to-amber-900 rounded-sm shadow-md"></div>
      </div>
    </div>
  </main>

  <!-- 하단 네비게이션 탭바 -->
  <nav class="fixed bottom-0 inset-x-0 bg-white/90 backdrop-blur-md border-t border-gray-200 py-2 px-6 flex justify-around items-center z-30">
    <button class="flex flex-col items-center text-xs text-indigo-600 font-bold">
      <span class="text-lg">📚</span>
      <span>책장</span>
    </button>
    <button class="flex flex-col items-center text-xs text-gray-400">
      <span class="text-lg">📊</span>
      <span>통계</span>
    </button>
    <button class="flex flex-col items-center text-xs text-gray-400">
      <span class="text-lg">🔍</span>
      <span>탐색</span>
    </button>
    <button class="flex flex-col items-center text-xs text-gray-400">
      <span class="text-lg">👤</span>
      <span>마이</span>
    </button>
  </nav>

  <!-- Service Worker 등록 -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
