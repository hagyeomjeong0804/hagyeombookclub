<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>루미북클럽 (Lumi Book Club)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#4F46E5',
          }
        }
      }
    }
  </script>
  
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <style>
    body { font-family: 'Pretendard', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#F9F8F6] dark:bg-[#121212] select-none text-gray-800 dark:text-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    function App() {
      const [viewMode, setViewMode] = React.useState('shelf'); // shelf, grid, list
      const [activeTab, setActiveTab] = React.useState('bookshelf'); // bookshelf, stats, search, profile
      const [statusTab, setStatusTab] = React.useState('all'); // all, reading, completed, wish
      const [searchTerm, setSearchTerm] = React.useState('');
      const [isDarkMode, setIsDarkMode] = React.useState(false);
      
      const [books, setBooks] = React.useState([
        { id: 1, title: '모든 삶은 작고 크다', author: '클라라 피츠', cover: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400&auto=format&fit=crop&q=80', status: 'reading', progress: 65, rating: 5, category: '소설', notesCount: 4 },
        { id: 2, title: '클린 코드', author: '로버트 C. 마틴', cover: 'https://images.unsplash.com/photo-1532012197267-da84d127e765?w=400&auto=format&fit=crop&q=80', status: 'completed', progress: 100, rating: 5, category: '개발', notesCount: 12 },
        { id: 3, title: '돈의 심리학', author: '모건 하우절', cover: 'https://images.unsplash.com/photo-1554415707-6e8cfc93fe23?w=400&auto=format&fit=crop&q=80', status: 'reading', progress: 30, rating: 4, category: '경제', notesCount: 2 },
        { id: 4, title: '아틀란틱', author: '니아 댄스', cover: 'https://images.unsplash.com/photo-1512820790803-83ca734da794?w=400&auto=format&fit=crop&q=80', status: 'wish', progress: 0, rating: 0, category: '인문', notesCount: 0 },
        { id: 5, title: '미움받을 용기', author: '기시미 이치로', cover: 'https://images.unsplash.com/photo-1495640388908-05fa85288e61?w=400&auto=format&fit=crop&q=80', status: 'completed', progress: 100, rating: 5, category: '심리', notesCount: 7 },
      ]);

      const [selectedBook, setSelectedBook] = React.useState(null);
      const [isAddModalOpen, setIsAddModalOpen] = React.useState(false);
      
      // 새 책 추가 폼 상태
      const [newTitle, setNewTitle] = React.useState('');
      const [newAuthor, setNewAuthor] = React.useState('');
      const [newCategory, setNewCategory] = React.useState('소설');

      const filteredBooks = books.filter(b => {
        const matchesStatus = statusTab === 'all' || b.status === statusTab;
        const matchesSearch = b.title.toLowerCase().includes(searchTerm.toLowerCase()) || b.author.toLowerCase().includes(searchTerm.toLowerCase());
        return matchesStatus && matchesSearch;
      });

      const handleAddBook = (e) => {
        e.preventDefault();
        if (!newTitle) return;
        const newB = {
          id: Date.now(),
          title: newTitle,
          author: newAuthor || '미상',
          cover: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400&auto=format&fit=crop&q=80',
          status: 'wish',
          progress: 0,
          rating: 0,
          category: newCategory,
          notesCount: 0
        };
        setBooks([newB, ...books]);
        setNewTitle('');
        setNewAuthor('');
        setIsAddModalOpen(false);
      };

      return (
        <div className={isDarkMode ? 'dark bg-[#121212] min-h-screen text-gray-100 pb-24' : 'bg-[#F9F8F6] min-h-screen text-gray-800 pb-24'}>
          {/* 상단 헤더 */}
          <header className="sticky top-0 z-30 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 px-4 py-3 flex items-center justify-between">
            <div className="flex items-center space-x-2">
              <span className="text-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-500 bg-clip-text text-transparent">📚 루미북클럽</span>
            </div>
            <div className="flex items-center space-x-3">
              <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 rounded-full bg-gray-100 dark:bg-gray-800 text-sm">
                {isDarkMode ? '☀️' : '🌙'}
              </button>
              <button onClick={() => setIsAddModalOpen(true)} className="bg-indigo-600 text-white px-3 py-1.5 rounded-full text-xs font-semibold shadow hover:bg-indigo-700 transition">
                + 책 추가
              </button>
            </div>
          </header>

          {/* 메인 콘텐츠 영역 */}
          <main className="max-w-md mx-auto p-4">
            {/* 스트릭 배너 */}
            <div className="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl p-4 text-white shadow-lg mb-4 flex items-center justify-between">
              <div>
                <p className="text-xs text-indigo-100">🔥 연속 독서 14일째</p>
                <h2 className="text-lg font-bold mt-0.5">이번 달 3권 완독 목표</h2>
                <p className="text-xs text-indigo-200 mt-1">목표 달성까지 앞으로 1권 남았어요!</p>
              </div>
              <div className="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center text-xl font-bold">
                75%
              </div>
            </div>

            {/* 검색 및 뷰 전환 바 */}
            <div className="flex items-center justify-between mb-3 gap-2">
              <input 
                type="text" 
                placeholder="책 제목 또는 저자 검색..." 
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                className="w-full px-3 py-2 text-sm bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500"
              />
              <div className="flex bg-gray-200 dark:bg-gray-800 p-1 rounded-xl shrink-0">
                <button onClick={() => setViewMode('shelf')} className={`px-2.5 py-1 text-xs rounded-lg font-medium transition ${viewMode === 'shelf' ? 'bg-white dark:bg-gray-700 shadow text-indigo-600 dark:text-indigo-400' : 'text-gray-500'}`}>선반</button>
                <button onClick={() => setViewMode('grid')} className={`px-2.5 py-1 text-xs rounded-lg font-medium transition ${viewMode === 'grid' ? 'bg-white dark:bg-gray-700 shadow text-indigo-600 dark:text-indigo-400' : 'text-gray-500'}`}>그리드</button>
              </div>
            </div>

            {/* 세그먼트 탭 */}
            <div className="flex space-x-1 bg-gray-200/70 dark:bg-gray-800/70 p-1 rounded-xl mb-4 text-xs font-medium">
              <button onClick={() => setStatusTab('all')} className={`flex-1 py-1.5 rounded-lg transition ${statusTab === 'all' ? 'bg-white dark:bg-gray-700 shadow text-indigo-600 dark:text-indigo-300' : 'text-gray-500'}`}>전체 ({books.length})</button>
              <button onClick={() => setStatusTab('reading')} className={`flex-1 py-1.5 rounded-lg transition ${statusTab === 'reading' ? 'bg-white dark:bg-gray-700 shadow text-indigo-600 dark:text-indigo-300' : 'text-gray-500'}`}>읽는 중</button>
              <button onClick={() => setStatusTab('completed')} className={`flex-1 py-1.5 rounded-lg transition ${statusTab === 'completed' ? 'bg-white dark:bg-gray-700 shadow text-indigo-600 dark:text-indigo-300' : 'text-gray-500'}`}>완독</button>
              <button onClick={() => setStatusTab('wish')} className={`flex-1 py-1.5 rounded-lg transition ${statusTab === 'wish' ? 'bg-white dark:bg-gray-700 shadow text-indigo-600 dark:text-indigo-300' : 'text-gray-500'}`}>위시</button>
            </div>

            {/* 책장 / 그리드 뷰 출력 */}
            {viewMode === 'shelf' ? (
              <div className="space-y-6">
                <div className="bg-amber-900/20 dark:bg-gray-800/50 p-4 rounded-2xl border border-amber-900/10 shadow-inner">
                  <div className="text-xs font-semibold text-amber-800 dark:text-amber-400 mb-3 flex items-center justify-between">
                    <span>🪵 원목 선반 1층</span>
                    <span>{filteredBooks.length}권</span>
                  </div>
                  <div className="grid grid-cols-3 gap-3">
                    {filteredBooks.map(book => (
                      <div key={book.id} onClick={() => setSelectedBook(book)} className="cursor-pointer group flex flex-col items-center">
                        <div className="w-full aspect-[1/1.4] rounded-lg overflow-hidden shadow-md group-hover:scale-105 transition duration-200 bg-gray-300 relative">
                          <img src={book.cover} alt={book.title} className="w-full h-full object-cover" />
                          <div className="absolute bottom-0 inset-x-0 bg-black/60 backdrop-blur-xs text-white text-[10px] py-0.5 px-1 text-center font-medium">
                            {book.progress}%
                          </div>
                        </div>
                        <p className="text-xs font-semibold mt-1.5 text-center truncate w-full">{book.title}</p>
                        <p className="text-[10px] text-gray-400 truncate w-full text-center">{book.author}</p>
                      </div>
                    ))}
                  </div>
                  {/* 선반 판재 효과 */}
                  <div className="mt-4 h-3 bg-gradient-to-r from-amber-800 via-amber-700 to-amber-900 rounded-sm shadow-md"></div>
                </div>
              </div>
            ) : (
              <div className="grid grid-cols-2 gap-3">
                {filteredBooks.map(book => (
                  <div key={book.id} onClick={() => setSelectedBook(book)} className="bg-white dark:bg-gray-800 p-3 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 cursor-pointer hover:shadow-md transition">
                    <div className="w-full aspect-[1/1.3] rounded-xl overflow-hidden mb-2">
                      <img src={book.cover} alt={book.title} className="w-full h-full object-cover" />
                    </div>
                    <h4 className="text-xs font-bold truncate">{book.title}</h4>
                    <p className="text-[10px] text-gray-500 truncate">{book.author}</p>
                    <div className="mt-2 w-full bg-gray-100 dark:bg-gray-700 h-1.5 rounded-full overflow-hidden">
                      <div className="bg-indigo-600 h-full rounded-full" style={{ width: `${book.progress}%` }}></div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </main>

          {/* 하단 네비게이션 탭바 */}
          <nav className="fixed bottom-0 inset-x-0 bg-white/90 dark:bg-gray-900/90 backdrop-blur-md border-t border-gray-200 dark:border-gray-800 py-2 px-6 flex justify-around items-center z-30">
            <button onClick={() => setActiveTab('bookshelf')} className={`flex flex-col items-center text-xs ${activeTab === 'bookshelf' ? 'text-indigo-600 dark:text-indigo-400 font-bold' : 'text-gray-400'}`}>
              <span className="text-lg">📚</span>
              <span>책장</span>
            </button>
            <button onClick={() => setActiveTab('stats')} className={`flex flex-col items-center text-xs ${activeTab === 'stats' ? 'text-indigo-600 dark:text-indigo-400 font-bold' : 'text-gray-400'}`}>
              <span className="text-lg">📊</span>
              <span>통계</span>
            </button>
            <button onClick={() => setActiveTab('search')} className={`flex flex-col items-center text-xs ${activeTab === 'search' ? 'text-indigo-600 dark:text-indigo-400 font-bold' : 'text-gray-400'}`}>
              <span className="text-lg">🔍</span>
              <span>탐색</span>
            </button>
            <button onClick={() => setActiveTab('profile')} className={`flex flex-col items-center text-xs ${activeTab === 'profile' ? 'text-indigo-600 dark:text-indigo-400 font-bold' : 'text-gray-400'}`}>
              <span className="text-lg">👤</span>
              <span>마이</span>
            </button>
          </nav>

          {/* 책 상세 모달 */}
          {selectedBook && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-white dark:bg-gray-900 w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl max-h-[85vh] overflow-y-auto">
                <div className="flex justify-between items-start mb-4">
                  <div className="flex gap-4">
                    <img src={selectedBook.cover} className="w-20 h-28 object-cover rounded-xl shadow" />
                    <div>
                      <span className="text-[10px] bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-300 px-2 py-0.5 rounded-full font-semibold">{selectedBook.category}</span>
                      <h3 className="text-base font-bold mt-1">{selectedBook.title}</h3>
                      <p className="text-xs text-gray-500 mt-0.5">{selectedBook.author}</p>
                      <p className="text-xs text-indigo-600 font-medium mt-2">진행률: {selectedBook.progress}%</p>
                    </div>
                  </div>
                  <button onClick={() => setSelectedBook(null)} className="text-gray-400 hover:text-gray-600 text-lg">✕</button>
                </div>

                <div className="space-y-4 my-4">
                  <div>
                    <label className="text-xs font-semibold text-gray-500">독서 진도 조절 ({selectedBook.progress}%)</label>
                    <input 
                      type="range" 
                      min="0" 
                      max="100" 
                      value={selectedBook.progress} 
                      onChange={(e) => {
                        const val = Number(e.target.value);
                        setSelectedBook({...selectedBook, progress: val, status: val === 100 ? 'completed' : val > 0 ? 'reading' : 'wish'});
                        setBooks(books.map(b => b.id === selectedBook.id ? {...b, progress: val, status: val === 100 ? 'completed' : val > 0 ? 'reading' : 'wish'} : b));
                      }}
                      className="w-full mt-1 accent-indigo-600"
                    />
                  </div>
                </div>

                <div className="flex gap-2 mt-6">
                  <button onClick={() => {
                    setBooks(books.filter(b => b.id !== selectedBook.id));
                    setSelectedBook(null);
                  }} className="flex-1 bg-red-50 text-red-600 dark:bg-red-950/40 dark:text-red-400 py-3 rounded-xl font-semibold text-xs">서재에서 삭제</button>
                  <button onClick={() => setSelectedBook(null)} className="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-semibold text-xs shadow-md">확인</button>
                </div>
              </div>
            </div>
          )}

          {/* 책 추가 모달 */}
          {isAddModalOpen && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white dark:bg-gray-900 w-full max-w-md rounded-3xl p-6 shadow-2xl">
                <h3 className="text-base font-bold mb-4">새 책 등록하기</h3>
                <form onSubmit={handleAddBook} className="space-y-3">
                  <div>
                    <label className="text-xs text-gray-500 font-medium">책 제목</label>
                    <input type="text" required value={newTitle} onChange={(e) => setNewTitle(e.target.value)} placeholder="책 제목을 입력하세요" className="w-full mt-1 px-3 py-2 text-sm bg-gray-50 dark:bg-gray-800 border rounded-xl" />
                  </div>
                  <div>
                    <label className="text-xs text-gray-500 font-medium">저자</label>
                    <input type="text" value={newAuthor} onChange={(e) => setNewAuthor(e.target.value)} placeholder="저자명을 입력하세요" className="w-full mt-1 px-3 py-2 text-sm bg-gray-50 dark:bg-gray-800 border rounded-xl" />
                  </div>
                  <div>
                    <label className="text-xs text-gray-500 font-medium">카테고리</label>
                    <select value={newCategory} onChange={(e) => setNewCategory(e.target.value)} className="w-full mt-1 px-3 py-2 text-sm bg-gray-50 dark:bg-gray-800 border rounded-xl">
                      <option value="소설">소설</option>
                      <option value="개발">개발</option>
                      <option value="경제">경제</option>
                      <option value="인문">인문</option>
                      <option value="심리">심리</option>
                    </select>
                  </div>
                  <div className="flex gap-2 pt-3">
                    <button type="button" onClick={() => setIsAddModalOpen(false)} className="flex-1 bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 py-2.5 rounded-xl text-xs font-semibold">취소</button>
                    <button type="submit" className="flex-1 bg-indigo-600 text-white py-2.5 rounded-xl text-xs font-semibold">추가</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
