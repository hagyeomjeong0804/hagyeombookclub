<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>루미북클럽 (Lumi Book Club)</title>

  <!-- PWA 필수 설정 -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#4F46E5" />

  <!-- iOS Safari 전용 메타태그 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="루미북클럽" />
  <link rel="apple-touch-icon" href="/icon-192.png" />

  <!-- 폰트 로드 (Pretendard) -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
</head>
<body class="bg-[#F9F8F6] dark:bg-[#121212] select-none font-['Pretendard',sans-serif]">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <!-- Service Worker 스크립트 등록 -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('PWA Service Worker 등록 성공:', reg.scope))
          .catch(err => console.error('PWA Service Worker 등록 실패:', err));
      });
    }
  </script>
</body>
</html>
